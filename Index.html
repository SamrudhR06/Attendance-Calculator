<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Calculator</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Attendance Calculator</h1>
    <p class="subtitle">Check your current attendance and plan your classes.</p>

    <div class="input-group">
      <label for="attended">Classes Attended</label>
      <input type="number" id="attended" placeholder="Enter classes attended" min="0" step="1">
    </div>

    <div class="input-group">
      <label for="total">Total Classes Conducted</label>
      <input type="number" id="total" placeholder="Enter total classes conducted" min="1" step="1">
    </div>

    <div class="input-group">
      <label for="required">Minimum Attendance % Required</label>
      <input type="number" id="required" placeholder="Example: 75" min="0" max="100" step="0.01">
    </div>

    <div class="button-group">
      <button id="calculateBtn">Calculate Attendance</button>
      <button id="resetBtn">Reset</button>
    </div>

    <div id="result" class="result" aria-live="polite"></div>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
